name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create
        required: true
        type: string
        default: v1.3.2

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download official Mindustry 160.7 compile dependency
        run: |
          curl --fail --location --retry 3 --output Mindustry-v160.7.jar https://github.com/Anuken/Mindustry/releases/download/v160.7/Mindustry.jar
          echo '36d94941a1639478ad1d9be25a9d802c6f77552f400c6da0338b7b019f63a0d1  Mindustry-v160.7.jar' | sha256sum -c -
      - name: Compile Java 17 plugin
        run: pwsh -File ./build.ps1 -MindustryJar "$GITHUB_WORKSPACE/Mindustry-v160.7.jar"
      - name: Run standalone rate-policy check (no game)
        run: |
          mkdir -p build/check
          javac --release 17 -d build/check src/main/java/ru/codex/mindustry/logicspeedfive/RatePolicy.java src/test/java/ru/codex/mindustry/logicspeedfive/RatePolicyCheck.java
          java -cp build/check ru.codex.mindustry.logicspeedfive.RatePolicyCheck
      - name: Package source archive
        run: git archive --format=zip --prefix=Fast-Logic-1.3.2/ --output=Fast-Logic-1.3.2-source.zip "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: Fast-Logic-1.3.2
          path: |
            build/Fast-Logic-1.3.2.jar
            Fast-Logic-1.3.2-source.zip
          if-no-files-found: error
      - name: Publish Mindustry v8 release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$RELEASE_TAG" = "v1.3.2"
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Fast Logic v1.3.2 [v160]" --notes "Fast Logic branding and catalog metadata. The original internal mod ID and saved settings are retained." build/Fast-Logic-1.3.2.jar Fast-Logic-1.3.2-source.zip
